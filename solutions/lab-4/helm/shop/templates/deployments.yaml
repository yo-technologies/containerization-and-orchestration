{{- range $role := list "api" "worker" }}
{{- $settings := index $.Values $role }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $role }}
  labels:
    {{- include "shop.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $role }}
spec:
  replicas: {{ $settings.replicas }}
  minReadySeconds: 5
  progressDeadlineSeconds: 90
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/name: {{ $role }}
  template:
    metadata:
      {{- with $settings.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "shop.labels" $ | nindent 8 }}
        app.kubernetes.io/name: {{ $role }}
    spec:
      {{- with $settings.priorityClass }}
      priorityClassName: {{ printf "%s-%s" $.Release.Name . | quote }}
      {{- end }}
      {{- if eq $role "api" }}
      {{- include "shop.apiSpreading" $ | nindent 6 }}
      {{- end }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $role }}
          image: "{{ $.Values.image.repository }}:{{ default $.Values.image.tag $settings.imageTag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_ROLE
              value: {{ $role | quote }}
            - name: HEALTH_FAIL
              value: {{ $settings.healthFail | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $.Release.Name }}-postgres-app
                  key: uri
          resources:
            {{- toYaml (default $.Values.resources $settings.resources) | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
{{- end }}
