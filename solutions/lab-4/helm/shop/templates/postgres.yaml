{{- if not (has .Values.postgres.pdb.mode (list "chart" "operator" "disabled")) }}
{{- fail "postgres.pdb.mode must be chart, operator or disabled" }}
{{- end }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "shop.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.postgres.instances }}
  enablePDB: {{ eq .Values.postgres.pdb.mode "operator" }}
  {{- with .Values.postgres.priorityClass }}
  priorityClassName: {{ printf "%s-%s" $.Release.Name . | quote }}
  {{- end }}
  imageName: {{ .Values.postgres.image | quote }}
  {{- with .Values.postgres.parameters }}
  postgresql:
    parameters:
      {{- toYaml . | nindent 6 }}
  {{- end }}
  inheritedMetadata:
    labels:
      app.kubernetes.io/part-of: shop
      owner: itmo
  storage:
    size: {{ .Values.postgres.storage }}
  resources:
    {{- toYaml .Values.postgres.resources | nindent 4 }}
  bootstrap:
    initdb:
      database: shop
      owner: shop
