{{- range $name, $settings := .Values.priorityClasses }}
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ printf "%s-%s" $.Release.Name $name }}
  labels:
    {{- include "shop.labels" $ | nindent 4 }}
value: {{ $settings.value }}
globalDefault: false
preemptionPolicy: {{ $settings.preemptionPolicy }}
{{- end }}
