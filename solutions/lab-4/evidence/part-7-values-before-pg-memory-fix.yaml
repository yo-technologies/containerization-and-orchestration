image:
  repository: ghcr.io/itmo-labs/shop
  tag: "0.1.0"
  pullPolicy: IfNotPresent
api:
  replicas: 3
  imageTag: "0.1.0"
  healthFail: false
  podAnnotations:
    lab4.itmo/rollout: memory-pressure-prep
  priorityClass: critical
  resources:
    requests:
      cpu: 250m
      memory: 100Mi
    limits:
      cpu: 250m
      memory: 100Mi
  pdb:
    enabled: true
    minAvailable: 2
  spreading:
    # Keep API replicas balanced across eligible hostname domains.
    enabled: true
    mechanism: topologySpreadConstraints # or podAntiAffinity (required)
  service:
    type: NodePort
    nodePort: 30080
worker:
  replicas: 2
  imageTag: "0.1.0"
  healthFail: false
  priorityClass: ""
batch:
  enabled: true
  replicas: 1
  nodeSelector: {}
  rollingUpdate:
    maxUnavailable: "25%"
    maxSurge: "25%"
  imageTag: "batch-0.1.0"
  memoryMiB: 32
  cpuWorkers: 1
  priorityClass: batch
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
# Fallback for roles without their own resource settings (worker).
resources:
  requests:
    cpu: 10m
    memory: 100Mi
  limits:
    # KRR simple leaves CPU unlimited; keep the existing cap for guardrails.
    cpu: 250m
    memory: 100Mi
postgres:
  instances: 1
  image: ghcr.io/cloudnative-pg/postgresql:17.6
  storage: 1Gi
  priorityClass: critical
  pdb:
    # chart | operator | disabled. Do not manage the same budget in two places.
    mode: chart
    minAvailable: 1
  resources:
    requests:
      cpu: 500m
      memory: 100Mi
    limits:
      cpu: 500m
      memory: 100Mi
priorityClasses:
  critical:
    value: 100000
    preemptionPolicy: PreemptLowerPriority
  batch:
    value: -1000
    preemptionPolicy: Never
monitoring:
  enabled: true
