apiVersion: v1
kind: Pod
metadata:
  name: bad-require-labels
  namespace: shop
  labels:
    app.kubernetes.io/part-of: shop
spec:
  restartPolicy: Never
  containers:
  - name: app
    image: ghcr.io/itmo-labs/shop:0.1.0
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 250m
        memory: 128Mi
    securityContext:
      privileged: false
      runAsNonRoot: true
