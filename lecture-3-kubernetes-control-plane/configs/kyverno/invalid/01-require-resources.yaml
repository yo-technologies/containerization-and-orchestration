apiVersion: v1
kind: Pod
metadata:
  name: bad-require-resources
  namespace: shop
  labels:
    app.kubernetes.io/part-of: shop
    owner: itmo
spec:
  restartPolicy: Never
  containers:
  - name: app
    image: ghcr.io/itmo-labs/shop:0.1.0
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
    securityContext:
      privileged: false
      runAsNonRoot: true
