apiVersion: v1
kind: Pod
metadata:
  name: bad-trusted-images
  namespace: shop
  labels:
    app.kubernetes.io/part-of: shop
    owner: itmo
spec:
  restartPolicy: Never
  containers:
  - name: app
    image: docker.io/library/nginx:1.27
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 250m
        memory: 128Mi
    securityContext:
      privileged: false
      runAsNonRoot: true
