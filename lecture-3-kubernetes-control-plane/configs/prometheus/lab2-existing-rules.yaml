apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: lab2-existing
  namespace: observability
  labels:
    monitoring: lab2
spec:
  groups:
  - name: api
    rules:
    - alert: APIHighErrorRate
      annotations:
        description: "\u041F\u0440\u043E\u0432\u0435\u0440\u0438\u0442\u044C \u043B\
          \u043E\u0433\u0438 \u043E\u0448\u0438\u0431\u043E\u043A, \u0442\u0440\u0430\
          \u0441\u0441\u0438\u0440\u043E\u0432\u043A\u0438 \u0438 \u043F\u043E\u0441\
          \u043B\u0435\u0434\u043D\u0438\u0435 \u0438\u0437\u043C\u0435\u043D\u0435\
          \u043D\u0438\u044F API."
        summary: "API: \u0434\u043E\u043B\u044F 5xx \u0432\u044B\u0448\u0435 5%"
      expr: "(\n  (sum(rate(http_errors_total{job=\"api\"}[1m])) or vector(0))\n \
        \ /\n  sum(rate(http_requests_total{job=\"api\"}[1m]))\n) > 0.05\n"
      for: 2m
      labels:
        service: api
        severity: critical
    - alert: APIHighLatency
      annotations:
        description: "\u041D\u0430\u0439\u0442\u0438 \u043C\u0435\u0434\u043B\u0435\
          \u043D\u043D\u044B\u0435 \u043E\u043F\u0435\u0440\u0430\u0446\u0438\u0438\
          \ \u0432 Jaeger; \u043F\u0440\u043E\u0432\u0435\u0440\u0438\u0442\u044C\
          \ \u0437\u0430\u0432\u0438\u0441\u0438\u043C\u043E\u0441\u0442\u0438, \u0440\
          \u0435\u0441\u0443\u0440\u0441\u044B \u0438 \u043F\u043E\u0441\u043B\u0435\
          \u0434\u043D\u0438\u0435 \u0438\u0437\u043C\u0435\u043D\u0435\u043D\u0438\
          \u044F."
        summary: "API: p95 \u0443\u0441\u043F\u0435\u0448\u043D\u044B\u0445 \u0437\
          \u0430\u043F\u0440\u043E\u0441\u043E\u0432 \u0432\u044B\u0448\u0435 1 \u0441\
          \u0435\u043A\u0443\u043D\u0434\u044B"
      expr: "histogram_quantile(\n  0.95,\n  sum by (le) (\n    rate(http_request_duration_seconds_bucket{job=\"\
        api\", code=~\"2..\"}[1m])\n  )\n) > 1\n"
      for: 2m
      labels:
        service: api
        severity: critical
    - alert: APIUnavailable
      annotations:
        description: "\u041F\u0440\u043E\u0432\u0435\u0440\u0438\u0442\u044C Pod API,\
          \ \u0433\u043E\u0442\u043E\u0432\u043D\u043E\u0441\u0442\u044C endpoints\
          \ Service \u0438 \u0441\u0435\u0442\u0435\u0432\u0443\u044E \u0434\u043E\
          \u0441\u0442\u0443\u043F\u043D\u043E\u0441\u0442\u044C."
        summary: "API: /health \u043D\u0435\u0434\u043E\u0441\u0442\u0443\u043F\u0435\
          \u043D \u0431\u043E\u043B\u044C\u0448\u0435 \u043C\u0438\u043D\u0443\u0442\
          \u044B"
      expr: probe_success{job="api-health"} == 0
      for: 1m
      labels:
        service: api
        severity: critical
