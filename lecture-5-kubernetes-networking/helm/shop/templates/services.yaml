{{- if .Values.workloads.enabled }}
{{- range $role := list "api" "worker" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $role }}
  labels:
    {{- include "shop.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $role }}
spec:
  type: {{ if eq $role "api" }}{{ $.Values.api.service.type }}{{ else }}ClusterIP{{ end }}
  {{- if and (eq $role "api") (eq $.Values.api.service.type "NodePort") }}
  externalTrafficPolicy: Local
  {{- end }}
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/name: {{ $role }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      {{- if and (eq $role "api") (eq $.Values.api.service.type "NodePort") }}
      nodePort: {{ $.Values.api.service.nodePort }}
      {{- end }}
{{- end }}

{{- end }}
