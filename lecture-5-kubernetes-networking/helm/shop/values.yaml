image:
  repository: ghcr.io/itmo-labs/shop
  tag: 0.1.0
  pullPolicy: IfNotPresent
api:
  replicas: 3
  imageTag: 0.1.0
  healthFail: false
  service:
    type: NodePort
    nodePort: 30080
worker:
  replicas: 2
  imageTag: 0.1.0
  healthFail: false
resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi
postgres:
  instances: 1
  image: ghcr.io/cloudnative-pg/postgresql:17.6
  storage: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
monitoring:
  enabled: false
  remoteTargets: []
workloads:
  enabled: true
tools:
  image: lab5-tools:1
networkPolicy:
  enabled: true
  dns: true
  databasePort: 5432
  databaseRoles:
  - api
  - worker
  apiClientRole: client
  apiPort: 8080
  dnsPort: 53
  externalClientCIDRs:
  - 172.22.0.1/32
  - 172.22.0.2/32
  monitorCIDRs:
  - 172.22.0.2/32
  apiServerCIDR: 172.22.0.3/32
client:
  node: shop-net-control-plane
