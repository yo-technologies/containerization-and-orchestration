{{- if .Values.workloadsEnabled }}
{{- if .Values.mesh.enabled }}
{{- if or (lt (int .Values.traffic.v2Weight) 0) (gt (int .Values.traffic.v2Weight) 100) }}
{{- fail "traffic.v2Weight must be between 0 and 100" }}
{{- end }}
{{- if and (not .Values.api.v2Enabled) (ne (int .Values.traffic.v2Weight) 0) }}
{{- fail "v2 disabled requires traffic.v2Weight=0" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.mesh.waypoint }}
  labels: {istio.io/waypoint-for: service}
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - {name: mesh, port: 15008, protocol: HBONE}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-split
spec:
  parentRefs:
    - {group: "", kind: Service, name: "{{ .Release.Name }}-api", port: 8080}
  rules:
    - backendRefs:
        - {name: "{{ .Release.Name }}-api-v1", port: 8080, weight: {{ sub 100 (int .Values.traffic.v2Weight) }}}
        {{- if .Values.api.v2Enabled }}
        - {name: "{{ .Release.Name }}-api-v2", port: 8080, weight: {{ .Values.traffic.v2Weight }}}
        {{- end }}
      timeouts: {request: 3s, backendRequest: 1s}
      {{- if .Values.mesh.retries }}
      retry:
        codes: [500]
        attempts: {{ .Values.mesh.retryAttempts }}
        backoff: 10ms
      {{- end }}
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: {{ .Release.Name }}-strict
spec:
  selector:
    matchLabels: {app: api}
  mtls: {mode: STRICT}
{{- end }}

{{- end }}
