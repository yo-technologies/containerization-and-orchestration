{{- if .Values.workloadsEnabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.api.serviceAccount }}
---
{{- range $version := list "v1" "v2" }}
{{- if or (eq $version "v1") $.Values.api.v2Enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-api-{{ $version }}
  labels: {app: api, version: {{ $version }}}
spec:
  replicas: {{ $.Values.api.replicas }}
  selector:
    matchLabels: {app: api, version: {{ $version }}}
  template:
    metadata:
      labels:
        app: api
        version: {{ $version }}
        service.istio.io/canonical-name: api
        service.istio.io/canonical-revision: {{ $version }}
        {{- if $.Values.mesh.enabled }}
        {{- toYaml $.Values.mesh.podLabels | nindent 8 }}
        {{- end }}
      annotations:
        {{- toYaml $.Values.mesh.podAnnotations | nindent 8 }}
    spec:
      serviceAccountName: {{ $.Values.api.serviceAccount }}
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532}
      containers:
        - name: api
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: VERSION, value: {{ $version | quote }}}
            - {name: FAIL, value: {{ $.Values.api.fail | quote }}}
            - {name: FLAKY, value: {{ $.Values.api.flaky | quote }}}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: "{{ $.Release.Name }}-postgres-app", key: uri}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 2}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-api-{{ $version }}
  labels: {lab6-metrics: api, version: {{ $version }}}
spec:
  selector: {app: api, version: {{ $version }}}
  ports: [{name: http, port: 8080, targetPort: http, appProtocol: http}]
---
{{- end }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  {{- if .Values.mesh.enabled }}
  labels:
    istio.io/use-waypoint: {{ .Values.mesh.waypoint }}
  {{- end }}
spec:
  selector: {app: api, version: v1}
  ports: [{name: http, port: 8080, targetPort: http, appProtocol: http}]

{{- end }}
