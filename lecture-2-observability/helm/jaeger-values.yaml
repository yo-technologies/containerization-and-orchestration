jaeger:
  replicas: 1

userconfig:
  extensions:
    healthcheckv2:
      use_v2: true
      http:
        endpoint: 0.0.0.0:13133
    jaeger_storage:
      backends:
        memory_store:
          memory:
            max_traces: 10000
    jaeger_query:
      storage:
        traces: memory_store
      http:
        endpoint: 0.0.0.0:16686

  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch: {}

  exporters:
    jaeger_storage_exporter:
      trace_storage: memory_store

  service:
    extensions: [healthcheckv2, jaeger_storage, jaeger_query]
    pipelines:
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [jaeger_storage_exporter]