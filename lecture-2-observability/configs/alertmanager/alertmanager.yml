global:
  resolve_timeout: 5m
route:
  receiver: dashboard-only
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  # Alerts appear in Alertmanager and Karma.
  # Add email_configs, slack_configs or webhook_configs for notifications.
  - name: dashboard-only
